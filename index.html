<!DOCTYPE html>
<html lang="eng">
<head>
    <meta charset="UTF-8">
    <title>* (It's her.)</title>
    <style>
        body {
            background-image: linear-gradient(rgba(5, 2, 2, 0.8), rgba(5, 2, 2, 0.8)), url('forest.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #050202;
            color: #d1b3b3;
            font-family: "Courier New", Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            user-select: none;
        }

        /* ============ ОКНА ============ */
        .terminal-window, .image-window {
            background-color: #1a1515;
            border: 2px solid #312121;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border-radius: 2px;
            position: absolute;
            z-index: 10;
        }

        .terminal-window {
            width: 100%;
            max-width: 640px;
        }

        .image-window {
            width: 480px;
            display: none;
        }

        .terminal-header {
            background-color: #702525;
            color: #ffffff;
            padding: 4px 10px;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
            user-select: none;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-icon {
            border: 1px solid #ffffff;
            padding: 0 4px;
            font-size: 11px;
            background: #1a1515;
            color: #702525;
        }

        .header-buttons span {
            border: 1px solid #ffffff;
            padding: 0px 4px;
            margin-left: 2px;
            font-size: 11px;
            background: #1a1515;
            cursor: pointer;
            display: inline-block;
            color: #ffffff;
        }

        .terminal-content {
            padding: 24px;
            min-height: 280px;
            line-height: 1.6;
            font-size: 15px;
        }

        .prompt {
            color: #8c96ac;
            margin: 0 0 16px 0;
        }

        .links {
            margin-top: 32px;
        }

        ul {
            list-style-type: none;
            padding-left: 0;
            margin: 16px 0;
        }

        li {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }

        a {
            color: #ff6666;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            position: relative;
            padding-left: 24px;
            outline: none;
        }

        a::before {
            content: "*";
            position: absolute;
            left: 0;
            color: #ff6666;
            width: 16px;
            text-align: center;
            font-size: 15px;
            line-height: 1;
        }

        a.active {
            color: #ffff33;
        }

        a.active::before {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            background-image: url('THE SOUL.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .image-container {
            position: relative;
            width: 100%;
            height: 340px;
            background: #000000;
            overflow: hidden;
        }

        .crt-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* ============ ЭФФЕКТ DELTARUNE (Наплыв красного) ============ */
        #vignette {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 5;
            opacity: 0;
            /* Мягкий, глубокий красный по краям */
            background: radial-gradient(ellipse at center, rgba(0,0,0,0) 30%, rgba(60, 0, 0, 0.5) 70%, rgba(20, 0, 0, 0.9) 100%);
            transition: opacity 1.5s ease;
        }

        body.memory-mode #vignette {
            opacity: 1;
            animation: deltarune-breathe 6s infinite alternate ease-in-out;
        }

        /* Медленное, зловещее "дыхание" тьмы */
        @keyframes deltarune-breathe {
            0% { filter: brightness(1); }
            100% { filter: brightness(1.4); }
        }

        /* ============ СЦЕНА С КНОПКОЙ ============ */
        .reveal-stage {
            position: fixed;
            inset: 0;
            z-index: 8;
            display: none;
            justify-content: center;
            align-items: center;
        }

        body.memory-mode .reveal-stage {
            display: flex;
        }

        body.memory-mode .terminal-window {
            display: none;
        }

        body.revealed .reveal-stage {
            display: none;
        }

        /* Строгая кнопка в стиле терминала */
        .reveal-btn {
            font-family: "Courier New", Courier, monospace;
            font-size: 16px;
            color: #d1b3b3;
            background: #1a1515;
            border: 2px solid #312121;
            padding: 12px 24px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            outline: none;
            transition: color 0.2s, border-color 0.2s;
        }

        .reveal-btn:hover {
            color: #ff6666;
            border-color: #702525;
        }
    </style>
</head>
<body>

<!-- Оверлей для красного наплыва -->
<div id="vignette"></div>

<!-- Главное терминальное окно -->
<div class="terminal-window" id="termWindow">
    <div class="terminal-header drag-handle">
        <div class="header-left">
            <div class="header-icon">A</div>
            <span>~</span>
        </div>
    </div>

    <div class="terminal-content">
        <p class="prompt">* ...find me. You promised.</p>
        <p class="prompt">dess1225@dess1225 ~&gt; <span id="cursor">█</span></p>

        <div class="links">
            <ul>
                <li><a href="#" id="revealLink">Ask the strange voice to reveal itself.</a></li>
                <li><a href="https://github.com" id="unconnectLink">Unconnect</a></li>
            </ul>
        </div>
    </div>
</div>

<!-- Сцена "память" -->
<div class="reveal-stage" id="revealStage">
    <button class="reveal-btn" id="revealBtn">REVEAL MEMORY</button>
</div>

<!-- Окно с постером -->
<div class="image-window" id="imgWindow">
    <div class="terminal-header drag-handle">
        <div class="header-left">
            <div class="header-icon">I</div>
            <span>*...I don’t remember who took the picture.</span>
        </div>
        <div class="header-buttons">
            <span>_</span><span>❑</span><span id="closeImgBtn">X</span>
        </div>
    </div>
    <div class="image-container">
        <img src="missing_poster.png" alt="missing poster" class="crt-image">
    </div>
</div>

<!-- Музыка -->
<audio id="bgm" src="mus_lost_memory.mp3" loop preload="auto"></audio>

<script>
    const term = document.getElementById('termWindow');
    const imgWin = document.getElementById('imgWindow');
    const revealLink = document.getElementById('revealLink');
    const unconnectLink = document.getElementById('unconnectLink');
    const closeImgBtn = document.getElementById('closeImgBtn');
    const revealBtn = document.getElementById('revealBtn');
    const bgm = document.getElementById('bgm');

    const menuLinks = [revealLink, unconnectLink];
    let currentIndex = 0;

    term.style.left = 'calc(50% - 320px)';
    term.style.top = 'calc(50% - 180px)';
    imgWin.style.left = 'calc(50% - 230px)';
    imgWin.style.top = 'calc(50% - 170px)';

    // Мигающий курсор (чисто для атмосферы)
    const cursor = document.getElementById('cursor');
    setInterval(() => {
        cursor.style.opacity = cursor.style.opacity === '0' ? '1' : '0';
    }, 500);

    /* ---------- Навигация по меню ---------- */
    function updateMenuSelection() {
        menuLinks.forEach((link, index) => {
            link.classList.toggle('active', index === currentIndex);
        });
    }

    menuLinks.forEach((link, index) => {
        link.addEventListener('mouseenter', () => {
            currentIndex = index;
            updateMenuSelection();
        });
    });

    window.addEventListener('keydown', (e) => {
        if (document.body.classList.contains('memory-mode')) {
            if (e.key === 'Escape' && imgWin.style.display === 'block') {
                closeImage();
            }
            return;
        }

        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
            e.preventDefault();
            currentIndex = (currentIndex - 1 + menuLinks.length) % menuLinks.length;
            updateMenuSelection();
        } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
            e.preventDefault();
            currentIndex = (currentIndex + 1) % menuLinks.length;
            updateMenuSelection();
        } else if (e.key === 'Enter' || e.key === 'z' || e.key === 'Z') {
            e.preventDefault();
            menuLinks[currentIndex].click();
        }
    });

    updateMenuSelection();

    /* ---------- Переход в "память" ---------- */
    revealLink.addEventListener('click', (e) => {
        e.preventDefault();
        document.body.classList.add('memory-mode');
        requestAnimationFrame(() => revealBtn.focus());
    });

    /* ---------- Кнопка REVEAL MEMORY ---------- */
    revealBtn.addEventListener('click', () => {
        document.body.classList.add('revealed');
        imgWin.style.display = 'block';
        imgWin.style.zIndex = highestZIndex() + 1;

        if (bgm.paused) {
            bgm.volume = 0.6; // Сразу на нормальную громкость, без плавных затуханий
            bgm.play().catch(() => {});
        }
    });

    /* ---------- Закрытие окна ---------- */
    function closeImage() {
        imgWin.style.display = 'none';
        document.body.classList.remove('revealed');
        revealBtn.focus();
    }

    closeImgBtn.addEventListener('click', closeImage);

    /* ---------- Z-index и перетаскивание ---------- */
    function highestZIndex() {
        return Math.max(
            ...Array.from(document.querySelectorAll('.terminal-window, .image-window'))
                .map(el => parseFloat(window.getComputedStyle(el).zIndex) || 0),
            10
        );
    }

    function makeDraggable(windowEl) {
        const handle = windowEl.querySelector('.drag-handle');
        let offsetX = 0, offsetY = 0, isDragging = false;

        windowEl.addEventListener('mousedown', () => {
            windowEl.style.zIndex = highestZIndex() + 1;
        });

        handle.addEventListener('mousedown', (e) => {
            isDragging = true;
            offsetX = e.clientX - windowEl.getBoundingClientRect().left;
            offsetY = e.clientY - windowEl.getBoundingClientRect().top;
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            windowEl.style.left = (e.clientX - offsetX) + 'px';
            windowEl.style.top = (e.clientY - offsetY) + 'px';
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
        });
    }

    makeDraggable(term);
    makeDraggable(imgWin);
</script>

</body>
</html>
