<!DOCTYPE html>
<html lang="eng">
<head>
    <meta charset="UTF-8">
    <title>* (It's her.)</title>
    <style>
        body {
            background-image: linear-gradient(rgba(5, 2, 2, 0.75), rgba(5, 2, 2, 0.75)), url('forest.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #050202;
            color: #bfa3a3;
            font-family: "Courier New", Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            user-select: none;
        }

        .terminal-window, .image-window {
            background-color: #1a1a1a;
            border: 1px solid #3c3c3c;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9);
            border-radius: 2px;
            position: absolute;
        }

        .terminal-window {
            width: 100%;
            max-width: 640px;
            z-index: 10;
        }

        .image-window {
            width: 480px;
            z-index: 20;
            display: none;
        }

        .terminal-header {
            background-color: #722f37;
            color: #ffffff;
            padding: 4px 8px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
            border-bottom: 1px solid #3c3c3c;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-icon {
            border: 1px solid #ffffff;
            padding: 0 3px;
            font-size: 10px;
            background: #1a1a1a;
            color: #722f37;
            font-weight: bold;
        }

        .header-buttons span {
            border: 1px solid #ffffff;
            padding: 0px 4px;
            margin-left: 2px;
            font-size: 10px;
            background: #1a1a1a;
            cursor: pointer;
            display: inline-block;
            color: #ffffff;
        }

        .terminal-content {
            padding: 16px;
            min-height: 280px;
            line-height: 1.5;
            font-size: 14px;
        }

        .prompt {
            color: #bfa3a3;
            margin: 0 0 12px 0;
        }

        .links {
            margin-top: 24px;
        }

        ul {
            list-style-type: none;
            padding-left: 0;
            margin: 0;
        }

        li {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }

        a {
            color: #cc4c4c;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            position: relative;
            padding-left: 20px;
        }

        a::before {
            content: "*";
            position: absolute;
            left: 0;
            color: #cc4c4c;
            width: 14px;
            text-align: center;
        }

        a:hover {
            color: #e6e630;
        }

        a:hover::before {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            background-image: url('THE SOUL.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .image-container {
            position: relative;
            width: 100%;
            height: 340px;
            background: #000000;
            overflow: hidden;
        }

        .crt-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

<div class="terminal-window" id="termWindow">
    <div class="terminal-header drag-handle">
        <div class="header-left">
            <div class="header-icon">A</div>
            <span>~</span>
        </div>
    </div>
    
    <div class="terminal-content">
        <p class="prompt">* The world is made in an adorable way.</p>
        <p class="prompt">dess1225@dess1225 ~> </p>

        <div class="links">
            <ul>
                <li><a href="#" id="revealLink">Ask the strange voice to reveal itself.</a></li>
                <li><a href="https://github.com">Unconnect</a></li>
            </ul>
        </div>
    </div>
</div>

<div class="image-window" id="imgWindow">
    <div class="terminal-header drag-handle">
        <div class="header-left">
            <div class="header-icon">I</div>
            <span>*...I don’t remember who took the picture.</span>
        </div>
        <div class="header-buttons">
            <span>_</span><span>❑</span><span id="closeImgBtn">X</span>
        </div>
    </div>
    <div class="image-container">
        <img src="vhs3.png" alt="lost signal" class="crt-image">
    </div>
</div>

<script>
    const term = document.getElementById('termWindow');
    const imgWin = document.getElementById('imgWindow');
    const revealLink = document.getElementById('revealLink');
    const closeImgBtn = document.getElementById('closeImgBtn');

    term.style.left = 'calc(50% - 320px)';
    term.style.top = 'calc(50% - 180px)';
    imgWin.style.left = 'calc(50% - 230px)';
    imgWin.style.top = 'calc(50% - 170px)';

    revealLink.addEventListener('click', (e) => {
        e.preventDefault();
        imgWin.style.display = 'block';
        imgWin.style.zIndex = highestZIndex() + 1;
    });

    closeImgBtn.addEventListener('click', () => {
        imgWin.style.display = 'none';
    });

    function highestZIndex() {
        return Math.max(
            ...Array.from(document.querySelectorAll('.terminal-window, .image-window'))
                .map(el => parseFloat(window.getComputedStyle(el).zIndex) || 0),
            10
        );
    }

    function makeDraggable(windowEl) {
        const handle = windowEl.querySelector('.drag-handle');
        let offsetX = 0, offsetY = 0, isDragging = false;

        windowEl.addEventListener('mousedown', () => {
            windowEl.style.zIndex = highestZIndex() + 1;
        });

        handle.addEventListener('mousedown', (e) => {
            isDragging = true;
            offsetX = e.clientX - windowEl.getBoundingClientRect().left;
            offsetY = e.clientY - windowEl.getBoundingClientRect().top;
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            windowEl.style.left = (e.clientX - offsetX) + 'px';
            windowEl.style.top = (e.clientY - offsetY) + 'px';
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
        });
    }

    makeDraggable(term);
    makeDraggable(imgWin);
</script>

</body>
</html>
