<!DOCTYPE html>
<html lang="eng">
<head>
    <meta charset="UTF-8">
    <title>* (It's her.)</title>
    <style>
        body {
            background-color: #120b0b;
            color: #d1b3b3;
            font-family: "Courier New", Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .terminal-window {
            background-color: #1a1515;
            border: 2px solid #702525;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 640px;
            border-radius: 2px;
        }

        .terminal-header {
            background-color: #702525;
            color: #ffffff;
            padding: 4px 10px;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-icon {
            border: 1px solid #ffffff;
            padding: 0 4px;
            font-size: 11px;
            background: #1a1515;
            color: #702525;
        }

        .header-buttons span {
            border: 1px solid #ffffff;
            padding: 0px 4px;
            margin-left: 2px;
            font-size: 11px;
            background: #1a1515;
            cursor: pointer;
        }

        .terminal-content {
            padding: 24px;
            min-height: 320px;
            line-height: 1.6;
            font-size: 15px;
        }

        .system-msg {
            color: #ff4d4d;
            margin-bottom: 24px;
        }

        .prompt {
            color: #8c96ac;
        }

        .cursor {
            background-color: #d1b3b3;
            animation: blink 1s infinite;
            display: inline-block;
            width: 9px;
            height: 16px;
            vertical-align: middle;
            margin-left: 2px;
        }

        .weird-links {
            margin-top: 32px;
            border-top: 1px dashed #542020;
            padding-top: 16px;
        }

        ul {
            list-style-type: none;
            padding-left: 0;
            margin: 16px 0;
        }

        li {
            margin-bottom: 12px;
        }

        a {
            color: #ff6666;
            text-decoration: none;
        }

        a:before {
            content: "* ";
        }

        a:hover {
            color: #ffff33;
        }

        a:hover:before {
            content: "♥ ";
            color: #ff3333;
        }

        #console-output {
            color: #ff8080;
            font-style: italic;
            margin-top: 20px;
            min-height: 24px;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>

<div class="terminal-window">
    <div class="terminal-header">
        <div class="header-left">
            <div class="header-icon">A</div>
            <span>~</span>
        </div>
        <div class="header-buttons">
            <span>_</span><span>❑</span><span>X</span>
        </div>
    </div>
    
    <div class="terminal-content">
        <div class="system-msg">* (It's her.)</div>
        
        <p class="prompt">dess1225@dess1225 ~> * Someone!? Anyone!? Can anyone hear me!?</p>
        <p>* No one can hear me, can they...?</p>
        
        <p>Куда пропала гитара? Куда пропали все воспоминания?</p>

        <div class="weird-links">
            <ul>
                <li><a href="#about" onclick="printLog('Запись: Сентябрь. Мы все еще искали её в лесу...')">Посмотреть логи системы</a></li>
                <li><a href="#missing" onclick="printLog('ОШИБКА: Объект Ноэль не отвечает. Связь потеряна.')">Проверить статус канала</a></li>
                <li><a href="https://github.com" target="_blank">Сбежать обратно в реальность</a></li>
            </ul>
        </div>
        
        <div id="console-output"></div>
        
        <p class="prompt" style="margin-top: 24px;">dess1225@dess1225 ~> <span class="cursor"></span></p>
    </div>
</div>

<script>
    function printLog(text) {
        document.getElementById('console-output').innerText = ">> " + text;
    }
</script>

</body>
</html>
