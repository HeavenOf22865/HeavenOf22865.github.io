<!DOCTYPE html>
<html lang="eng">
<head>
    <meta charset="UTF-8">
    <title>* (It's her.)</title>
    <style>
        body {
            background-color: #120b0b;
            color: #d1b3b3;
            font-family: "Courier New", Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            user-select: none;
        }

        .terminal-window, .image-window {
            background-color: #1a1515;
            border: 2px solid #702525;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            border-radius: 2px;
            position: absolute;
        }

        .terminal-window {
            width: 100%;
            max-width: 640px;
            z-index: 10;
        }

        .image-window {
            width: 320px;
            z-index: 20;
            display: none;
        }

        .terminal-header {
            background-color: #702525;
            color: #ffffff;
            padding: 6px 10px;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-icon {
            border: 1px solid #ffffff;
            padding: 0 5px;
            font-size: 11px;
            background: #1a1515;
            color: #702525;
        }

        .header-buttons span {
            border: 1px solid #ffffff;
            padding: 0px 5px;
            margin-left: 3px;
            font-size: 11px;
            background: #1a1515;
            cursor: pointer;
            display: inline-block;
        }

        .terminal-content {
            padding: 24px;
            min-height: 280px;
            line-height: 1.6;
            font-size: 15px;
        }

        .prompt {
            color: #8c96ac;
            margin: 0 0 16px 0;
        }

        .links {
            margin-top: 24px;
        }

        ul {
            list-style-type: none;
            padding-left: 0;
            margin: 0;
        }

        li {
            margin-bottom: 14px;
            display: flex;
            align-items: center;
        }

        a {
            color: #ff6666;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            position: relative;
            padding-left: 24px;
            transition: color 0.1s ease;
        }

        a::before {
            content: "*";
            position: absolute;
            left: 0;
            color: #ff6666;
        }

        a:hover {
            color: #ffff33;
        }

        a:hover::before {
            content: "";
            position: absolute;
            left: 0;
            width: 16px;
            height: 16px;
            background-image: url('THE SOUL.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .image-container {
            position: relative;
            width: 100%;
            height: 240px;
            background: #000;
            overflow: hidden;
        }

        .crt-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(1.2) brightness(0.9) saturate(0.8);
            animation: vhs-glitch 4s infinite linear;
        }

        .image-container::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 25;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        @keyframes vhs-glitch {
            0% { transform: translate(0, 0) skewX(0deg); filter: hue-rotate(0deg); }
            10% { transform: translate(1px, -1px) skewX(0.5deg); }
            11% { transform: translate(-1px, 1px) skewX(-1deg); filter: hue-rotate(90deg); }
            12% { transform: translate(0, 0) skewX(0deg); filter: hue-rotate(0deg); }
            49% { transform: translate(0, 0) skewX(0deg); }
            50% { transform: translate(-0.5px, 0.5px) skewX(1deg); }
            51% { transform: translate(0, 0) skewX(0deg); }
            90% { transform: translate(0, 0) skewX(0deg); }
            91% { transform: translate(2px, -2px) skewX(-2deg); filter: saturate(2); }
            92% { transform: translate(0, 0) skewX(0deg); filter: hue-rotate(0deg); }
        }
    </style>
</head>
<body>

<div class="terminal-window" id="termWindow">
    <div class="terminal-header drag-handle">
        <div class="header-left">
            <div class="header-icon">A</div>
            <span>dess1225@dess1225: ~</span>
        </div>
        <div class="header-buttons">
            <span>_</span><span>❑</span><span>X</span>
        </div>
    </div>
    
    <div class="terminal-content">
        <p class="prompt">dess1225@dess1225 ~> * I can hear that f*#%ing scratching again...</p>
        <p class="prompt">dess1225@dess1225 ~> * If anyone is here, show yourselves!</p>

        <div class="links">
            <ul>
                <li><a href="#" id="revealLink">Ask the strange voice to reveal itself.</a></li>
                <li><a href="https://github.com" target="_blank">Unconnect</a></li>
            </ul>
        </div>
    </div>
</div>

<div class="image-window" id="imgWindow">
    <div class="terminal-header drag-handle">
        <div class="header-left">
            <div class="header-icon">I</div>
            <span>* (It's her image.)</span>
        </div>
        <div class="header-buttons">
            <span id="closeImgBtn">X</span>
        </div>
    </div>
    <div class="image-container">
        <img src="https://unsplash.com" alt="red woods" class="crt-image">
    </div>
</div>

<script>
    const term = document.getElementById('termWindow');
    const imgWin = document.getElementById('imgWindow');
    const revealLink = document.getElementById('revealLink');
    const closeImgBtn = document.getElementById('closeImgBtn');

    term.style.left = 'calc(50% - 320px)';
    term.style.top = 'calc(50% - 180px)';
    imgWin.style.left = 'calc(50% - 160px)';
    imgWin.style.top = 'calc(50% - 120px)';

    revealLink.addEventListener('click', (e) => {
        e.preventDefault();
        imgWin.style.display = 'block';
        imgWin.style.zIndex = highestZIndex() + 1;
    });

    closeImgBtn.addEventListener('click', () => {
        imgWin.style.display = 'none';
    });

    function highestZIndex() {
        return Math.max(
            ...Array.from(document.querySelectorAll('.terminal-window, .image-window'))
                .map(el => parseFloat(window.getComputedStyle(el).zIndex) || 0),
            10
        );
    }

    function makeDraggable(windowEl) {
        const handle = windowEl.querySelector('.drag-handle');
        let offsetX = 0, offsetY = 0, isDragging = false;

        windowEl.addEventListener('mousedown', () => {
            windowEl.style.zIndex = highestZIndex() + 1;
        });

        handle.addEventListener('mousedown', (e) => {
            isDragging = true;
            offsetX = e.clientX - windowEl.getBoundingClientRect().left;
            offsetY = e.clientY - windowEl.getBoundingClientRect().top;
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            windowEl.style.left = (e.clientX - offsetX) + 'px';
            windowEl.style.top = (e.clientY - offsetY) + 'px';
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
        });
    }

    makeDraggable(term);
    makeDraggable(imgWin);
</script>

</body>
</html>
