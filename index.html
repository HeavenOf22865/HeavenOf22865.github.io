<!DOCTYPE html>
<html lang="eng">
<head>
    <meta charset="UTF-8">
    <title>* (It's her.)</title>
    <style>
        body {
            background-color: #050202;
            color: #bfa3a3;
            font-family: "Courier New", Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            user-select: none;
        }

        .terminal-window, .image-window {
            background-color: #0a0707;
            border: 2px solid #521a1a;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9);
            border-radius: 2px;
            position: absolute;
        }

        .terminal-window {
            width: 100%;
            max-width: 640px;
            z-index: 10;
        }

        .image-window {
            width: 460px;
            z-index: 20;
            display: none;
        }

        .terminal-header {
            background-color: #521a1a;
            color: #d9c5c5;
            padding: 6px 10px;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-icon {
            border: 1px solid #521a1a;
            padding: 0 5px;
            font-size: 11px;
            background: #0a0707;
            color: #ff4d4d;
        }

        .header-buttons span {
            border: 1px solid #521a1a;
            padding: 0px 5px;
            margin-left: 3px;
            font-size: 11px;
            background: #0a0707;
            cursor: pointer;
            display: inline-block;
            color: #bfa3a3;
        }

        .terminal-content {
            padding: 24px;
            min-height: 280px;
            line-height: 1.6;
            font-size: 15px;
        }

        .prompt {
            color: #8fa0c2;
            margin: 0 0 16px 0;
            text-shadow: 0 0 2px rgba(143, 160, 194, 0.3);
        }

        .links {
            margin-top: 24px;
        }

        ul {
            list-style-type: none;
            padding-left: 0;
            margin: 0;
        }

        li {
            margin-bottom: 14px;
            display: flex;
            align-items: center;
        }

        a {
            color: #cc4c4c;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            position: relative;
            padding-left: 24px;
            transition: color 0.1s ease;
        }

        a::before {
            content: "*";
            position: absolute;
            left: 0;
            color: #cc4c4c;
        }

        a:hover {
            color: #e6e630;
        }

        a:hover::before {
            content: "";
            position: absolute;
            left: 0;
            width: 16px;
            height: 16px;
            background-image: url('THE SOUL.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .image-container {
            position: relative;
            width: 100%;
            height: 340px;
            background: #030101;
            overflow: hidden;
        }

        .crt-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(1.2) brightness(0.8) saturate(0.7);
            animation: vhs-distortion 5s infinite linear;
        }

        .image-container::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0) 95%,
                rgba(0,0,0,0.4) 95%
            );
            background-size: 100% 6px;
            z-index: 25;
            pointer-events: none;
        }

        .vhs-lines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 3px
            );
            z-index: 26;
            pointer-events: none;
            opacity: 0.8;
        }

        .vhs-tracking {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: transparent;
            z-index: 27;
            pointer-events: none;
            animation: tracking-bar 8s infinite linear;
        }

        @keyframes tracking-bar {
            0% { background: linear-gradient(transparent 0%, rgba(255,255,255,0.05) 10%, rgba(255,255,255,0.08) 13%, transparent 15%); transform: translateY(-100%); }
            100% { background: linear-gradient(transparent 0%, rgba(255,255,255,0.05) 10%, rgba(255,255,255,0.08) 13%, transparent 15%); transform: translateY(100%); }
        }

        @keyframes vhs-distortion {
            0% { transform: translate(0, 0) scale(1); filter: blur(0.3px); }
            2% { transform: translate(-1px, 0.5px) scale(1.005) skewX(0.5deg); filter: blur(0.5px) hue-rotate(10deg); }
            3% { transform: translate(1px, -0.5px) scale(1); filter: blur(0.3px); }
            50% { transform: translate(0, 0) scale(1); }
            51% { transform: translate(2px, 1px) skewX(-1deg); filter: saturate(1.5); }
            52% { transform: translate(0, 0) scale(1); }
            95% { transform: translate(0, 0) scale(1); }
            96% { transform: translate(-2px, -1px) scale(1.01); filter: blur(0.8px); }
            97% { transform: translate(0, 0) scale(1); }
        }
    </style>
</head>
<body>

<div class="terminal-window" id="termWindow">
    <div class="terminal-header drag-handle">
        <div class="header-left">
            <div class="header-icon">A</div>
            <span>dess1225@dess1225: ~</span>
        </div>
        <div class="header-buttons">
            <span>_</span><span>❑</span><span>X</span>
        </div>
    </div>
    
    <div class="terminal-content">
        <p class="prompt">dess1225@dess1225 ~> * I can hear that f*#%ing scratching again...</p>
        <p class="prompt">dess1225@dess1225 ~> * If anyone is here, show yourselves!</p>

        <div class="links">
            <ul>
                <li><a href="#" id="revealLink">Ask the strange voice to reveal itself.</a></li>
                <li><a href="https://github.com" target="_blank">Unconnect</a></li>
            </ul>
        </div>
    </div>
</div>

<div class="image-window" id="imgWindow">
    <div class="terminal-header drag-handle">
        <div class="header-left">
            <div class="header-icon">I</div>
            <span>* (It's her image.)</span>
        </div>
        <div class="header-buttons">
            <span id="closeImgBtn">X</span>
        </div>
    </div>
    <div class="image-container">
        <div class="vhs-lines"></div>
        <div class="vhs-tracking"></div>
        <img src="vhs3.png" alt="lost signal" class="crt-image">
    </div>
</div>

<script>
    const term = document.getElementById('termWindow');
    const imgWin = document.getElementById('imgWindow');
    const revealLink = document.getElementById('revealLink');
    const closeImgBtn = document.getElementById('closeImgBtn');

    term.style.left = 'calc(50% - 320px)';
    term.style.top = 'calc(50% - 180px)';
    imgWin.style.left = 'calc(50% - 230px)';
    imgWin.style.top = 'calc(50% - 170px)';

    revealLink.addEventListener('click', (e) => {
        e.preventDefault();
        imgWin.style.display = 'block';
        imgWin.style.zIndex = highestZIndex() + 1;
    });

    closeImgBtn.addEventListener('click', () => {
        imgWin.style.display = 'none';
    });

    function highestZIndex() {
        return Math.max(
            ...Array.from(document.querySelectorAll('.terminal-window, .image-window'))
                .map(el => parseFloat(window.getComputedStyle(el).zIndex) || 0),
            10
        );
    }

    function makeDraggable(windowEl) {
        const handle = windowEl.querySelector('.drag-handle');
        let offsetX = 0, offsetY = 0, isDragging = false;

        windowEl.addEventListener('mousedown', () => {
            windowEl.style.zIndex = highestZIndex() + 1;
        });

        handle.addEventListener('mousedown', (e) => {
            isDragging = true;
            offsetX = e.clientX - windowEl.getBoundingClientRect().left;
            offsetY = e.clientY - windowEl.getBoundingClientRect().top;
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            windowEl.style.left = (e.clientX - offsetX) + 'px';
            windowEl.style.top = (e.clientY - offsetY) + 'px';
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
        });
    }

    makeDraggable(term);
    makeDraggable(imgWin);
</script>

</body>
</html>
